<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TodoApp</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#111827,#1e3a8a);
        }

        .card{
            width:370px;
            padding:40px;
            border-radius:24px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.15);
            box-shadow:0 8px 30px rgba(0,0,0,0.3);
        }

        h1{
            color:white;
            text-align:center;
            margin-bottom:10px;
            font-size:32px;
        }

        h2{
            text-align:center;
            color:#d1d5db;
            margin-bottom:30px;
            font-size:16px;
            font-weight:normal;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:16px;
            border:none;
            border-radius:14px;
            background:rgba(255,255,255,0.1);
            color:white;
            outline:none;
        }

        input::placeholder{
            color:#cbd5e1;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:14px;
            background:#6366f1;
            color:white;
            font-size:15px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-2px);
            background:#4f46e5;
        }

        .google-btn{
            margin-top:12px;
            background:#ef4444;
        }

        .google-btn:hover{
            background:#dc2626;
        }

        p{
            text-align:center;
            margin-top:22px;
            color:#d1d5db;
            font-size:14px;
        }

        a{
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        .flash{
            background:rgba(239,68,68,0.2);
            color:#fecaca;
            padding:12px;
            border-radius:12px;
            margin-bottom:18px;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>✓ TodoApp</h1>
    <h2>Welcome Back</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Sign In</button>

        <button
            type="button"
            class="google-btn"
            onclick="window.location.href=`{{ url_for('google_login') }}`">
            Continue with Google
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{{ url_for('register') }}">Register</a>
    </p>

</div>

</body>
</html>
