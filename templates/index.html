<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#111827,#1e3a8a);
            display:flex;
            justify-content:center;
            padding:40px 20px;
        }

        .container{
            width:100%;
            max-width:700px;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        h1{
            color:white;
            font-size:34px;
        }

        .logout{
            text-decoration:none;
            background:#ef4444;
            color:white;
            padding:12px 18px;
            border-radius:14px;
            transition:0.3s;
        }

        .logout:hover{
            background:#dc2626;
        }

        .card{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.15);
            padding:30px;
            border-radius:24px;
            box-shadow:0 8px 30px rgba(0,0,0,0.3);
        }

        .welcome{
            color:#e5e7eb;
            margin-bottom:20px;
        }

        .add-form{
            display:flex;
            gap:12px;
            margin-bottom:25px;
        }

        .add-form input{
            flex:1;
            padding:14px;
            border:none;
            border-radius:14px;
            background:rgba(255,255,255,0.1);
            color:white;
            outline:none;
        }

        .add-form input::placeholder{
            color:#d1d5db;
        }

        .add-form button{
            padding:14px 20px;
            border:none;
            border-radius:14px;
            background:#6366f1;
            color:white;
            cursor:pointer;
            transition:0.3s;
        }

        .add-form button:hover{
            background:#4f46e5;
            transform:translateY(-2px);
        }

        .todo{
            background:rgba(255,255,255,0.08);
            padding:18px;
            border-radius:18px;
            margin-bottom:18px;
        }

        .todo-top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:12px;
        }

        .todo-text{
            color:white;
            font-size:16px;
        }

        .done{
            text-decoration:line-through;
            opacity:0.6;
        }

        .actions a{
            text-decoration:none;
            color:#c7d2fe;
            margin-left:12px;
            font-size:14px;
        }

        .edit-form{
            display:flex;
            gap:10px;
        }

        .edit-form input{
            flex:1;
            padding:12px;
            border:none;
            border-radius:12px;
            background:rgba(255,255,255,0.1);
            color:white;
            outline:none;
        }

        .edit-form button{
            padding:12px 16px;
            border:none;
            border-radius:12px;
            background:#10b981;
            color:white;
            cursor:pointer;
        }

        .flash{
            background:rgba(239,68,68,0.2);
            color:#fecaca;
            padding:12px;
            border-radius:12px;
            margin-bottom:18px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="topbar">
        <h1>✓ TodoApp</h1>

        <a class="logout" href="{{ url_for('logout') }}">
            Logout
        </a>
    </div>

    <div class="card">

        <div class="welcome">
            Welcome, <b>{{ user }}</b>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="flash">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form class="add-form" method="POST" action="/add">

            <input type="text" name="text" placeholder="Add a new task">

            <button type="submit">Add</button>

        </form>

        {% for tid, todo in todos.items() %}

        <div class="todo">

            <div class="todo-top">

                <div class="todo-text {% if todo.done %}done{% endif %}">
                    {{ todo.text }}
                </div>

                <div class="actions">
                    <a href="/toggle/{{ tid }}">Toggle</a>
                    <a href="/delete/{{ tid }}">Delete</a>
                </div>

            </div>

            <form class="edit-form" method="POST" action="/edit/{{ tid }}">

                <input type="text" name="text" placeholder="Edit task">

                <button type="submit">Update</button>

            </form>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
